<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Auto Social">
<meta name="theme-color" content="#080C12">
<title>Auto Social</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens. The whole UI retints when body[data-brand] changes. ── */
:root {
  --bg: #080C12; --bg2: #0D1520; --bg3: #121C28; --bg4: #172030;
  --line: rgba(208,160,48,0.22); --line2: rgba(255,255,255,0.07);
  --text: #EEE8DC; --muted: #7A8898; --muted2: #4A5868;
  --accent: #D0A030; --accent-ink: #1A1200; --accent-dim: rgba(208,160,48,0.14);
  --green: #2ECC71; --green-dim: rgba(46,204,113,0.12);
  --red: #E74C3C; --red-dim: rgba(231,76,60,0.12);
  --amber: #F0A04A;
  --font-display: "Playfair Display", serif;
  --font-body: "DM Sans", sans-serif;
  --font-mono: "DM Mono", monospace;
  --r: 14px; --r-sm: 9px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
body[data-brand="Sealed"] {
  --bg: #0C0D0F; --bg2: #131417; --bg3: #191B1F; --bg4: #202329;
  --line: rgba(200,240,74,0.22); --line2: rgba(255,255,255,0.07);
  --text: #E8E9EB; --muted: #8B8F98; --muted2: #5A5F69;
  --accent: #C8F04A; --accent-ink: #0C0D0F; --accent-dim: rgba(200,240,74,0.12);
  --font-display: "Archivo", sans-serif;
  --font-body: "DM Sans", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
}

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; padding-bottom: calc(80px + var(--safe-b)); transition: background .25s; }
button, input, textarea, select { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
textarea { resize: none; }
::selection { background: var(--accent-dim); }

/* ── Header + brand switch ── */
.hdr { position: sticky; top: 0; z-index: 90; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; }
.hdr-row { display: flex; align-items: center; gap: 10px; }
.brand-switch { display: flex; gap: 4px; background: var(--bg3); border: 1px solid var(--line2); border-radius: 999px; padding: 3px; flex: 1; min-width: 0; }
.brand-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 8px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; color: var(--muted); transition: all .18s; min-height: 38px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-btn img { width: 20px; height: 20px; border-radius: 5px; object-fit: cover; }
.brand-btn.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent); }
.hdr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--line2); display: grid; place-items: center; color: var(--muted); font-size: 1.05rem; }
.icon-btn.spinning svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--line); display: grid; place-items: center; }

/* ── Sub nav ── */
.subnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; padding-bottom: 2px; }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { padding: 7px 13px; border-radius: 999px; font-size: 0.78rem; font-weight: 500; color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
.subnav button.active { color: var(--text); background: var(--bg3); border-color: var(--line2); }
.subnav .n { font-family: var(--font-mono); font-size: 0.6rem; color: var(--accent); margin-left: 5px; }

/* ── Layout ── */
.wrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }
.view { display: none; }
.view.active { display: block; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.pane { display: none; }
.pane.active { display: block; }

.card { background: var(--bg2); border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; margin-bottom: 12px; }
.card.hl { border-color: var(--line); }
.card-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px; width: 100%; text-align: left; }
.card-title { font-family: var(--font-display); font-size: 1.02rem; font-weight: 700; letter-spacing: -0.01em; }
body[data-brand="Sealed"] .card-title { text-transform: uppercase; letter-spacing: .04em; font-size: .92rem; }
.card-sub { font-size: .72rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
.card-body { padding: 0 14px 14px; }
.chev { color: var(--muted2); transition: transform .2s; font-size: .9rem; }
.open > .card-head .chev { transform: rotate(180deg); }
.collapsible .card-body { display: none; }
.collapsible.open .card-body { display: block; }

.lbl { font-family: var(--font-mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; display: flex; align-items: center; justify-content: space-between; }
.lbl:first-child { margin-top: 0; }
.in { width: 100%; background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 11px 12px; font-size: .92rem; line-height: 1.5; color: var(--text); transition: border-color .15s; }
.in:focus { outline: none; border-color: var(--accent); }
.in.mono { font-family: var(--font-mono); font-size: .82rem; }
.in.over { border-color: var(--red); }
select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.cc { font-family: var(--font-mono); font-size: .6rem; color: var(--muted2); text-align: right; margin-top: 4px; }
.cc.over { color: var(--red); }
.tiny { font-size: .7rem; color: var(--muted); line-height: 1.5; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 16px; border-radius: var(--r-sm); font-size: .86rem; font-weight: 600; border: 1px solid var(--line2); background: var(--bg3); color: var(--text); transition: all .15s; min-height: 42px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary.loading { opacity: .7; }
.btn.ghost { background: transparent; }
.btn.ok { background: var(--green-dim); color: var(--green); border-color: rgba(46,204,113,.3); }
.btn.danger { background: var(--red-dim); color: var(--red); border-color: rgba(231,76,60,.3); }
.btn.sm { padding: 6px 10px; font-size: .72rem; min-height: 30px; border-radius: 7px; }
.btn.copied { background: var(--green-dim); color: var(--green); }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { padding: 7px 12px; border-radius: 999px; font-size: .76rem; font-weight: 500; color: var(--muted); background: var(--bg3); border: 1px solid var(--line2); }
.pill.active { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
.pill.done { color: var(--green); border-color: rgba(46,204,113,.35); background: var(--green-dim); }
.pill.off { opacity: .4; text-decoration: line-through; }
.divider { height: 1px; background: var(--line2); margin: 14px 0; }

/* ── Post cards (StrategyDynamics) ── */
.post { margin-bottom: 10px; animation: fade .25s both; }
.post .card-head { padding: 12px 14px; gap: 9px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.post.approved .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.post.rejected .dot { background: var(--red); box-shadow: 0 0 8px var(--red); }
.tag { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; background: var(--accent-dim); color: var(--accent); flex: none; }
.tag.md { background: rgba(31,78,121,.35); color: #8FB8E8; }
.tag.grey { background: var(--bg4); color: var(--muted); }
.post-h { flex: 1; min-width: 0; font-size: .9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.post-d { font-family: var(--font-mono); font-size: .62rem; color: var(--muted2); flex: none; }
.post .card-body { display: none; padding-top: 4px; }
.post.open .card-body { display: block; }
.img-prev { border-radius: var(--r-sm); overflow: hidden; margin-bottom: 10px; background: var(--bg3); }
.img-prev img { width: 100%; display: block; }
.img-ph { padding: 18px; text-align: center; font-size: .72rem; color: var(--muted2); font-family: var(--font-mono); }
.gfx { position: relative; width: 100%; aspect-ratio: 1080/1350; background: var(--bg3); border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line2); }
.gfx iframe { position: absolute; top: 0; left: 0; width: 1080px; height: 1350px; border: 0; transform-origin: 0 0; pointer-events: none; }
.gfx .img-ph { position: absolute; inset: 0; display: grid; place-items: center; }
.gfx-code { margin-top: 8px; font-family: var(--font-mono); font-size: .7rem; min-height: 160px; }
.res { margin-top: 8px; font-family: var(--font-mono); font-size: .68rem; line-height: 1.7; }
.res .ok { color: var(--green); } .res .err { color: var(--red); }

/* ── Sealed composer ── */
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px 14px; text-align: center; color: var(--muted); background: var(--accent-dim); cursor: pointer; transition: all .15s; }
.drop.over { border-style: solid; background: color-mix(in srgb, var(--accent) 22%, transparent); }
.drop strong { display: block; color: var(--text); font-size: .95rem; margin-bottom: 3px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; }
.drop span { font-size: .74rem; }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.thumbs::-webkit-scrollbar { display: none; }
.thumb { position: relative; flex: none; width: 76px; height: 136px; border-radius: 9px; overflow: hidden; background: var(--bg3); border: 1px solid var(--line2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.uploading::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.thumb .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; font-size: .8rem; display: grid; place-items: center; }
.thumb .n { position: absolute; bottom: 4px; left: 4px; font-family: var(--font-mono); font-size: .58rem; background: rgba(0,0,0,.6); padding: 1px 5px; border-radius: 4px; }
.angles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.angle { padding: 9px 4px; border-radius: 9px; font-size: .7rem; font-weight: 600; text-align: center; background: var(--bg3); border: 1px solid var(--line2); color: var(--muted); }
.angle.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.gen-btn { margin-top: 12px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .9rem; min-height: 50px; }
.plat { background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 11px 12px; margin-bottom: 10px; transition: opacity .15s; }
.plat.off { opacity: .45; }
.plat-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.plat-name { font-weight: 600; font-size: .86rem; display: flex; align-items: center; gap: 7px; }
.plat-name .sv { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: .62rem; font-weight: 800; font-family: var(--font-mono); }
.sv.ig { background: linear-gradient(135deg,#F58529,#DD2A7B,#8134AF); color: #fff; }
.sv.tt { background: #000; color: #69C9D0; border: 1px solid #333; }
.sv.th { background: #000; color: #fff; border: 1px solid #333; }
.plat-head .sp { flex: 1; }
.sw { position: relative; width: 42px; height: 24px; border-radius: 999px; background: var(--bg4); border: 1px solid var(--line2); transition: background .15s; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: all .15s; }
.sw.on { background: var(--accent); border-color: transparent; }
.sw.on::after { left: 20px; background: var(--accent-ink); }
.sw:disabled { opacity: .35; }
.plat .in { background: var(--bg2); }
.plat .in + .in { margin-top: 6px; }
.what { font-size: .74rem; color: var(--muted); font-style: italic; padding: 8px 10px; border-left: 2px solid var(--accent); margin-bottom: 10px; line-height: 1.5; }
.mode { display: flex; gap: 6px; background: var(--bg3); border-radius: 999px; padding: 3px; border: 1px solid var(--line2); }
.mode button { flex: 1; padding: 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.mode button.active { background: var(--bg4); color: var(--text); }
.send-bar { position: sticky; bottom: calc(10px + var(--safe-b)); z-index: 50; background: color-mix(in srgb, var(--bg2) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }

/* history */
.hist { display: flex; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line2); width: 100%; text-align: left; align-items: center; }
.hist:first-child { border-top: 0; }
.hist img { width: 42px; height: 74px; object-fit: cover; border-radius: 6px; background: var(--bg3); flex: none; }
.hist .t { flex: 1; min-width: 0; }
.hist .h { font-size: .84rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist .m { font-family: var(--font-mono); font-size: .6rem; color: var(--muted2); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; }
.hist .m .s { color: var(--green); }

/* thread generator output */
.tp { background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 11px 12px; margin-bottom: 8px; }
.tp.hook { border-color: var(--line); } .tp.cta { border-color: rgba(46,204,113,.25); }
.tp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.tp-lbl { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tp-txt { font-size: .9rem; line-height: 1.55; white-space: pre-wrap; }
.tp-n { font-family: var(--font-mono); font-size: .58rem; color: var(--muted2); margin-top: 6px; text-align: right; }
.tp-n.over { color: var(--red); }

/* insights / auto */
.at { padding: 11px 0; border-top: 1px solid var(--line2); }
.at:first-child { border-top: 0; }
.at-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.at-time { font-family: var(--font-mono); font-size: .6rem; color: var(--muted2); }
.at-topic { font-size: .86rem; font-weight: 500; margin-bottom: 4px; }
.at-body { font-size: .78rem; color: var(--muted); line-height: 1.5; white-space: pre-wrap; max-height: 7.5em; overflow: hidden; }
.at-meta { font-family: var(--font-mono); font-size: .58rem; color: var(--muted2); margin-top: 5px; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty .ic { font-size: 1.8rem; margin-bottom: 8px; color: var(--muted2); }
.empty .tx { font-weight: 500; }
.empty .sb { font-size: .74rem; margin-top: 4px; color: var(--muted2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--bg3); border: 1px solid var(--line2); border-radius: var(--r-sm); padding: 10px; }
.stat .v { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.stat .k { font-family: var(--font-mono); font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.ins-t { width: 100%; border-collapse: collapse; font-size: .76rem; }
.ins-t th { font-family: var(--font-mono); font-size: .56rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line2); }
.ins-t td { padding: 7px 6px; border-bottom: 1px solid var(--line2); font-family: var(--font-mono); font-size: .72rem; }
.ins-t td:first-child { font-family: var(--font-body); font-size: .8rem; }
.ins-post { padding: 8px 0; border-top: 1px solid var(--line2); }
.ins-post .meta { font-family: var(--font-mono); font-size: .58rem; color: var(--muted2); margin-bottom: 3px; }
.ins-post .txt { font-size: .78rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* loading / toast / login */
.loading { padding: 32px; text-align: center; color: var(--muted); font-size: .8rem; }
.spinner { width: 26px; height: 26px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 10px; }
.toast { position: fixed; bottom: calc(24px + var(--safe-b)); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: .82rem; font-weight: 600; opacity: 0; transition: all .22s; z-index: 999; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.login { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
.login.show { display: flex; }
.login form { width: 100%; max-width: 340px; text-align: center; }
.login img { width: 60px; height: 60px; border-radius: 14px; margin-bottom: 14px; }
.login h1 { font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 4px; }
.login h1 span { color: var(--accent); }
.login p { font-size: .78rem; color: var(--muted); margin-bottom: 18px; }
.login .in { margin-bottom: 10px; text-align: center; font-size: 1rem; }
.login .err { color: var(--red); font-size: .76rem; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body data-brand="StrategyDynamics">

<div class="login" id="loginOverlay">
  <form onsubmit="return submitLogin(event)">
    <img src="/images/sd_icon.png" alt="">
    <h1>Auto <span>Social</span></h1>
    <p>Sign in to continue</p>
    <input type="password" id="loginPassword" class="in" placeholder="Password" autocomplete="current-password">
    <button type="submit" class="btn primary block">Unlock</button>
    <div class="err" id="loginError"></div>
  </form>
</div>

<header class="hdr">
  <div class="hdr-row">
    <div class="brand-switch" role="tablist">
      <button class="brand-btn active" data-brand="StrategyDynamics" onclick="setBrand('StrategyDynamics')"><img src="/images/sd_icon.png" alt="">StrategyDynamics</button>
      <button class="brand-btn" data-brand="Sealed" onclick="setBrand('Sealed')"><img src="/images/sealed_icon.png" alt="">Sealed</button>
    </div>
    <div class="hdr-right">
      <span class="badge" id="pendingBadge" style="display:none"></span>
      <button class="icon-btn" id="refreshBtn" onclick="refreshCurrent()" aria-label="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
  <nav class="subnav" id="subnav-StrategyDynamics">
    <button class="active" onclick="setPane('sd','posts',this)">Posts<span class="n" id="postsN"></span></button>
    <button onclick="setPane('sd','photo',this)">Photo post</button>
    <button onclick="setPane('sd','threads',this)">Thread Generator</button>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let brand = localStorage.getItem('as.brand') || 'StrategyDynamics';
let channels = null;              // from GET /api/channels
let allPosts = [], currentFilter = 'Pending Review';
const loaded = { auto:false, insights:false };

// ── Auth gate: any /api 401 pops the login overlay ──
const _fetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const res = await _fetch(url, opts);
  if (res.status === 401 && String(url).startsWith('/api/')) showLogin();
  return res;
};
function showLogin() {
  const ov = document.getElementById('loginOverlay');
  if (!ov.classList.contains('show')) { ov.classList.add('show'); setTimeout(() => document.getElementById('loginPassword').focus(), 50); }
}
async function submitLogin(e) {
  e.preventDefault();
  const err = document.getElementById('loginError'); err.textContent = '';
  try {
    const res = await _fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('loginPassword').value }) });
    if (!res.ok) { err.textContent = 'Wrong password'; return false; }
    location.reload();
  } catch { err.textContent = 'Connection failed'; }
  return false;
}

// ── Helpers ──
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function autosize(el){ if(!el)return; el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
let toastTimer;
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }
function doC(text){ if(navigator.clipboard){navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));}else fallbackCopy(text); }
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
function flashBtn(btn){ if(!btn)return; const o=btn.textContent; btn.classList.add('copied'); btn.textContent='✓'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent=o;},1400); }
function copyEl(id,btn){ const el=document.getElementById(id); if(!el)return; doC(el.value!==undefined?el.value:el.textContent); flashBtn(btn); showToast('Copied'); }
function pillarShort(p){ const m={'Performance Proof':'Proof','Strategy Deep Dive':'Strat','Strategy / Algo Deep Dives':'Strat','Product Showcase':'Product','Educational':'Edu','Educational Principles':'Edu','Market Commentary':'Commentary','Behind the Scenes':'BTS','Behind the Scenes / Founder':'BTS'}; return m[p]||p||'—'; }
function spin(on){ document.getElementById('refreshBtn').classList.toggle('spinning',!!on); }
function hasChannel(b,p){ return !!(channels && channels.brands && channels.brands[b] && channels.brands[b].channels[p]); }

// ── Brand + panes ──
function setBrand(b){
  brand=b; localStorage.setItem('as.brand',b);
  document.body.dataset.brand=b;
  document.querySelectorAll('.brand-btn').forEach(x=>x.classList.toggle('active',x.dataset.brand===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+b));
  document.getElementById('subnav-StrategyDynamics').style.display = b==='StrategyDynamics'?'':'none';
  document.getElementById('subnav-Sealed').style.display = b==='Sealed'?'':'none';
  document.querySelector('meta[name=theme-color]').content = b==='Sealed'?'#0C0D0F':'#080C12';
  const pb=document.getElementById('pendingBadge'); pb.style.display=(b==='StrategyDynamics'&&pb.textContent)?'':'none';
  if(b==='StrategyDynamics' && !allPosts.length) loadPosts();
  if(b==='Sealed'){ C.s.applyChannels(); if(!C.s.loadedHist) C.s.loadHistory(); }
}
function setPane(group, name, btn){
  btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active')); btn.classList.add('active');
  document.querySelectorAll('#view-'+(group==='sd'?'StrategyDynamics':'Sealed')+' .pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+group+'-'+name));
  if(name==='auto'&&!loaded.auto) loadThreadLog();
  if(name==='insights'&&!loaded.insights) loadInsights();
  if(name==='history') C.s.loadHistory();
  if(name==='photo') C.p.loadHistory();
  window.scrollTo({top:0});
}
function refreshCurrent(){
  if(brand==='StrategyDynamics'){ loadPosts(); loaded.auto=loaded.insights=false; const a=document.querySelector('#pane-sd-auto.active'); if(a)loadThreadLog(); const i=document.querySelector('#pane-sd-insights.active'); if(i)loadInsights(); if(document.querySelector('#pane-sd-photo.active')) C.p.loadHistory(); }
  else C.s.loadHistory();
}
async function loadChannels(){
  try{ const r=await fetch('/api/channels'); channels=r.ok?await r.json():null; }catch{ channels=null; }
  Object.values(C).forEach(c=>c.applyChannels());
  if(allPosts.length) renderPosts();
}

// ─────────────────────────────────────────────────────────────────────────────
// StrategyDynamics — posts
// ─────────────────────────────────────────────────────────────────────────────
async function loadPosts(){
  spin(true);
  document.getElementById('postsContainer').innerHTML='<div class="loading"><div class="spinner"></div>Loading posts</div>';
  try{ const r=await fetch('/api/posts'); allPosts=await r.json(); if(!Array.isArray(allPosts)) throw 0; renderPosts(); }
  catch{ document.getElementById('postsContainer').innerHTML='<div class="empty"><div class="ic">⚠</div><div class="tx">Failed to load</div><div class="sb">Check connection and refresh</div></div>'; }
  finally{ spin(false); }
}
function setFilter(f,el){ currentFilter=f; el.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.remove('active')); el.classList.add('active'); renderPosts(); }
function renderPosts(){
  const filtered=currentFilter==='all'?allPosts:allPosts.filter(p=>p.status===currentFilter);
  const pending=allPosts.filter(p=>p.status==='Pending Review').length;
  const b=document.getElementById('pendingBadge'); b.textContent=pending||''; b.title=pending+' pending review'; b.style.display=(pending&&brand==='StrategyDynamics')?'':'none';
  document.getElementById('postsN').textContent=pending||'';
  if(!filtered.length){ const ip=currentFilter==='Pending Review'; document.getElementById('postsContainer').innerHTML='<div class="empty"><div class="ic">'+(ip?'✓':'○')+'</div><div class="tx">'+(ip?'All clear':'Nothing here')+'</div><div class="sb">'+(ip?'No posts pending review':'No posts match this filter')+'</div></div>'; return; }
  document.getElementById('postsContainer').innerHTML=filtered.map((p,i)=>renderCard(p,i)).join('');
}
function brandOf(p){ const s=String(p.brand||'').toLowerCase(); return s.includes('market')?'MarketDynamics':'StrategyDynamics'; }
function renderCard(post,idx){
  const r=post.rowIndex, sc=post.status==='Approved'?'approved':post.status==='Rejected'?'rejected':'';
  const bk=brandOf(post);
  return `<div class="card post ${sc}" id="card-${r}" style="animation-delay:${idx*30}ms">
  <button class="card-head" onclick="toggleCard(${r})">
    <span class="dot"></span>
    <span class="tag ${bk==='MarketDynamics'?'md':''}">${bk==='MarketDynamics'?'MD':'SD'}</span>
    <span class="tag grey">${esc(pillarShort(post.pillar))}</span>
    <span class="post-h">${esc(post.headline||'—')}</span>
    <span class="post-d">${esc(post.date||'')}</span>
    <span class="chev">▾</span>
  </button>
  <div class="card-body" id="body-${r}">
    ${post.image_url?`<div class="img-prev"><img src="${esc(post.image_url)}" alt="" onerror="this.parentElement.innerHTML='<div class=img-ph>Source image expired</div>'"></div>`:''}
    <div class="lbl">Instagram · TikTok caption <button class="btn sm" onclick="copyEl('f-caption-${r}',this)">Copy</button></div>
    <textarea class="in" id="f-caption-${r}" rows="3" oninput="updateCC(${r},'caption',2200);autosize(this)">${esc(post.caption)}</textarea>
    <div class="cc" id="cc-caption-${r}">${post.caption.length} / 2200</div>
    <div class="lbl">Threads <button class="btn sm" onclick="copyEl('f-threads_post-${r}',this)">Copy</button></div>
    <textarea class="in" id="f-threads_post-${r}" rows="2" oninput="updateCC(${r},'threads_post',500);autosize(this)">${esc(post.threads_post)}</textarea>
    <div class="cc ${post.threads_post.length>500?'over':''}" id="cc-threads_post-${r}">${post.threads_post.length} / 500</div>
    <div class="divider"></div>
    ${renderGfx(post,r)}
    <div class="divider"></div>
    ${renderBuffer(post,r)}
    <div class="divider"></div>
    <div class="lbl">Posted</div>
    <div class="pills">
      <button class="pill ${post.posted_ig?'done':''}" id="pig-${r}" onclick="togglePosted(${r},'posted_ig','pig-${r}')">${post.posted_ig?'✓ ':''}Instagram</button>
      <button class="pill ${post.posted_threads?'done':''}" id="pth-${r}" onclick="togglePosted(${r},'posted_threads','pth-${r}')">${post.posted_threads?'✓ ':''}Threads</button>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn ok" onclick="setStatus(${r},'Approved')">✓ Approve</button>
      <button class="btn danger" onclick="setStatus(${r},'Rejected')">✕ Reject</button>
      <button class="btn" onclick="saveEdits(${r})">Save</button>
    </div>
  </div></div>`;
}
function toggleCard(r){ const c=document.getElementById('card-'+r); if(!c)return; const open=c.classList.toggle('open'); if(open){ populateGfx(r); ['caption','threads_post'].forEach(f=>autosize(document.getElementById('f-'+f+'-'+r))); } }
function updateCC(r,f,max){ const el=document.getElementById('f-'+f+'-'+r), cc=document.getElementById('cc-'+f+'-'+r); if(!el||!cc)return; cc.textContent=el.value.length+' / '+max; cc.classList.toggle('over',el.value.length>max); }

// ── Graphic ──
function renderGfx(post,r){
  const has=!!(post.graphic_html&&post.graphic_html.trim());
  return `<div class="lbl">Post graphic · 1080×1350 <button class="btn sm" onclick="toggleGfxCode(${r})">Edit HTML</button></div>
  <div class="gfx" id="gfx-wrap-${r}">
    <iframe id="gfx-frame-${r}" sandbox="allow-same-origin"${has?'':' style="display:none"'}></iframe>
    <div class="img-ph" id="gfx-empty-${r}"${has?' style="display:none"':''}>No graphic on this post yet</div>
  </div>
  <textarea class="in gfx-code" id="f-graphic_html-${r}" hidden spellcheck="false" oninput="markGfxDirty(${r})">${esc(post.graphic_html||'')}</textarea>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="gfx-dl-${r}" onclick="downloadGraphic(${r},this)"${has?'':' disabled'}>⬇ Download PNG</button>
    <button class="btn" id="gfx-upd-${r}" onclick="refreshGfxPreview(${r})" hidden>Update preview</button>
  </div>`;
}
// Mirror of the server's render-time logo guard (injectLogoGuard in server.js).
const LOGO_GUARD_STYLE="<style>img[src*='/images/brand/'][src*='-logo']{height:56px !important;width:auto !important;max-width:none !important;min-width:0 !important;object-fit:contain !important;flex:none !important;display:block !important;margin-left:0 !important;margin-right:auto !important;align-self:flex-start !important;justify-self:start !important;}</style>";
function injectLogoGuard(html){ const i=html.search(/<\/head\s*>/i); return i!==-1?html.slice(0,i)+LOGO_GUARD_STYLE+html.slice(i):LOGO_GUARD_STYLE+html; }
function populateGfx(r){
  const ta=document.getElementById('f-graphic_html-'+r), frame=document.getElementById('gfx-frame-'+r), empty=document.getElementById('gfx-empty-'+r);
  if(!ta||!frame)return;
  const html=ta.value.trim()?injectLogoGuard(ta.value.trim()):'';
  if(html){ if(frame.srcdoc!==html)frame.srcdoc=html; frame.style.display=''; if(empty)empty.style.display='none'; } else { frame.style.display='none'; if(empty)empty.style.display=''; }
  sizeGfx(r);
}
function sizeGfx(r){ const w=document.getElementById('gfx-wrap-'+r), f=document.getElementById('gfx-frame-'+r); if(!w||!f||!w.clientWidth)return; f.style.transform='scale('+(w.clientWidth/1080)+')'; }
function toggleGfxCode(r){ const ta=document.getElementById('f-graphic_html-'+r), u=document.getElementById('gfx-upd-'+r); if(!ta)return; const show=ta.hidden; ta.hidden=!show; if(u)u.hidden=!show; }
function markGfxDirty(r){ const dl=document.getElementById('gfx-dl-'+r), ta=document.getElementById('f-graphic_html-'+r); if(dl&&ta)dl.disabled=!ta.value.trim(); }
function refreshGfxPreview(r){ populateGfx(r); markGfxDirty(r); showToast('Preview updated'); }
window.addEventListener('resize',()=>document.querySelectorAll('.post.open').forEach(c=>sizeGfx(c.id.replace('card-',''))));
async function downloadGraphic(r,btn){
  const ta=document.getElementById('f-graphic_html-'+r); const html=ta?ta.value.trim():'';
  if(!html){showToast('No graphic on this post');return;}
  const orig=btn.textContent; btn.disabled=true; btn.textContent='Rendering…';
  try{
    const res=await fetch('/api/graphic/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html})});
    if(!res.ok){ let m='Render failed'; try{m=(await res.json()).detail||m;}catch{} throw new Error(m); }
    const blob=await res.blob(); const post=allPosts.find(p=>p.rowIndex===r);
    const base=(post&&post.headline?post.headline:'post-'+r).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||('post-'+r);
    const file=new File([blob],'sd-'+base+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); showToast('Saved ✓'); return; }catch(e){ if(e&&e.name==='AbortError')return; } }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    showToast('PNG downloaded');
  }catch(e){ showToast(e.message||'Render failed'); } finally{ btn.disabled=false; btn.textContent=orig; }
}

// ── Save / status ──
async function patch(r,updates){ try{ await fetch('/api/posts/'+r,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)}); }catch{ showToast('Save failed'); } }
async function savePost(r){ const u={}; ['graphic_html','caption','threads_post'].forEach(f=>{const el=document.getElementById('f-'+f+'-'+r); if(el)u[f]=el.value;}); await patch(r,u); }
async function saveEdits(r){ await savePost(r); showToast('Saved ✓'); }
async function setStatus(r,status){
  await patch(r,{status}); const post=allPosts.find(p=>p.rowIndex===r); if(post)post.status=status;
  const card=document.getElementById('card-'+r);
  if(card){ card.className='card post open '+(status==='Approved'?'approved':status==='Rejected'?'rejected':''); if(currentFilter!=='all'&&currentFilter!==status){ card.style.transition='opacity .35s,transform .35s'; card.style.opacity='0'; card.style.transform='translateX(16px)'; setTimeout(renderPosts,350); } }
  showToast('Marked as '+status);
}
async function togglePosted(r,field,btnId){
  const btn=document.getElementById(btnId), post=allPosts.find(p=>p.rowIndex===r); if(!post)return;
  const v=post[field]?'':new Date().toISOString(); post[field]=v;
  const label=field==='posted_ig'?'Instagram':'Threads';
  if(btn){btn.classList.toggle('done',!!v); btn.textContent=(v?'✓ ':'')+label;}
  await patch(r,{[field]:v}); showToast(v?label+' posted ✓':label+' unmarked');
}

// ── Buffer (SD/MD) ──
const bufMode={};
function renderBuffer(post,r){
  const bk=brandOf(post);
  const ch=p=>hasChannel(bk,p);
  const btn=(p,label)=>`<button class="btn" id="buf-${p}-${r}" onclick="sendBuffer(${r},['${p}'],this)"${ch(p)?'':' disabled title="No '+p+' channel for '+bk+'"'}>${label}</button>`;
  return `<div class="lbl">Publish via Buffer <button class="btn sm" id="buf-brand-${r}" onclick="toggleBrand(${r})">◆ ${bk}</button></div>
  <div class="mode" style="margin-bottom:8px"><button class="active" onclick="setBufMode(${r},'queue',this)">Add to queue</button><button onclick="setBufMode(${r},'now',this)">Post now</button></div>
  <button class="btn primary block" onclick="sendBuffer(${r},['instagram','threads','tiktok'],this)">⚡ Send to all channels</button>
  <div class="row" style="margin-top:8px">${btn('instagram','Instagram')}${btn('threads','Threads')}${btn('tiktok','TikTok')}</div>
  <div class="res" id="buf-result-${r}"></div>`;
}
function setBufMode(r,mode,btn){ bufMode[r]=mode; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
async function toggleBrand(r){
  const post=allPosts.find(p=>p.rowIndex===r); if(!post)return;
  const next=brandOf(post)==='MarketDynamics'?'StrategyDynamics':'MarketDynamics'; post.brand=next;
  await patch(r,{brand:next}); showToast('Brand set: '+next);
  const card=document.getElementById('card-'+r); if(card){ const body=document.getElementById('body-'+r); const html=renderCard(post,0); const tmp=document.createElement('div'); tmp.innerHTML=html; card.replaceWith(tmp.firstElementChild); document.getElementById('card-'+r).classList.add('open'); populateGfx(r); ['caption','threads_post'].forEach(f=>autosize(document.getElementById('f-'+f+'-'+r))); }
}
async function sendBuffer(r,chs,btn){
  const mode=bufMode[r]||'queue';
  if(mode==='now'&&!confirm('Post to '+(chs.length>1?'all channels':chs[0])+' NOW — this goes live. Continue?'))return;
  const orig=btn.textContent; btn.disabled=true; btn.textContent='Sending…';
  const out=document.getElementById('buf-result-'+r); if(out)out.innerHTML='';
  try{
    await savePost(r);
    const resp=await fetch('/api/buffer/send/'+r,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channels:chs,mode})});
    const data=await resp.json(); if(!resp.ok)throw new Error(data.error||'Send failed');
    const results=data.results||{};
    if(out)out.innerHTML=Object.entries(results).map(([k,v])=>v.ok?'<div class="ok">✓ '+esc(k)+' — '+(mode==='now'?'posted':'queued')+'</div>':'<div class="err">✕ '+esc(k)+' — '+esc(v.error||'failed')+'</div>').join('');
    const anyFail=Object.values(results).some(v=>!v.ok);
    showToast(anyFail?'Sent — some channels failed':(mode==='now'?'Posted via Buffer ✓':'Queued in Buffer ✓'));
  }catch(e){ if(out)out.innerHTML='<div class="err">'+esc(e.message)+'</div>'; showToast('Send failed'); }
  finally{ btn.disabled=false; btn.textContent=orig; }
}

// ─────────────────────────────────────────────────────────────────────────────
// StrategyDynamics — Thread Generator / Auto Threads / Insights
// ─────────────────────────────────────────────────────────────────────────────
let lastThread=null, tgSeq=0;
async function generateThread(){
  const topic=document.getElementById('tg-topic').value.trim(), pillar=document.getElementById('tg-pillar').value, count=parseInt(document.getElementById('tg-count').value,10)||3;
  const out=document.getElementById('tg-output'), btn=document.getElementById('tgGenerate');
  if(!topic){showToast('Enter a topic first');return;}
  btn.classList.add('loading'); btn.disabled=true; btn.textContent='Generating…';
  out.innerHTML='<div class="loading"><div class="spinner"></div>Writing your thread</div>';
  try{
    const res=await fetch('/api/threads/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,pillar,count})});
    const data=await res.json(); if(!res.ok)throw new Error(data.error||'Generation failed');
    lastThread=data; renderThread(data);
  }catch(e){ out.innerHTML='<div class="empty"><div class="ic">⚠</div><div class="tx">'+esc(e.message)+'</div><div class="sb">Check the Make scenario is on, then try again</div></div>'; }
  finally{ btn.classList.remove('loading'); btn.disabled=false; btn.textContent='Generate thread'; }
}
function threadPost(label,text,cls){ const id='tgp-'+(tgSeq++); const n=String(text).length; return '<div class="tp '+cls+'"><div class="tp-head"><span class="tp-lbl">'+esc(label)+'</span><button class="btn sm" onclick="copyEl(\''+id+'\',this)">Copy</button></div><div class="tp-txt" id="'+id+'">'+esc(text)+'</div><div class="tp-n'+(n>500?' over':'')+'">'+n+' chars</div></div>'; }
function renderThread(t){
  const out=document.getElementById('tg-output'); const tag=t.topic_tag?String(t.topic_tag).replace(/^#/,''):'';
  const parts=['<div class="row" style="margin-bottom:10px;align-items:center"><span class="tag">'+esc(pillarShort(t.pillar))+'</span>'+(tag?'<button class="btn sm" onclick="copyTag(this)">#'+esc(tag)+' · copy</button>':'')+'<button class="btn sm" onclick="copyWholeThread(this)">Copy all</button></div>'];
  const single=!(t.posts||[]).length&&!t.cta;
  if(t.hook)parts.push(threadPost(single?'Single post':'Hook · Post 1',t.hook,'hook'));
  (t.posts||[]).forEach((p,i)=>parts.push(threadPost('Reply · Post '+(i+2),p,'')));
  if(t.cta)parts.push(threadPost('CTA · Final post',t.cta,'cta'));
  if(tag)parts.push('<div class="tiny" style="margin:6px 0 10px">#'+esc(tag)+' is sent as the Threads topic tag — inline hashtags don\'t link on Threads.</div>');
  parts.push('<div class="row"><button class="btn primary" style="flex:2" onclick="sendThreadToBuffer(\'queue\',this)">⚡ Queue in Buffer</button><button class="btn" onclick="sendThreadToBuffer(\'now\',this)">Post now</button></div>');
  out.innerHTML=parts.join('');
}
async function sendThreadToBuffer(mode,btn){
  if(!lastThread||!lastThread.hook){showToast('Generate a thread first');return;}
  if(mode==='now'&&!confirm('Post this thread to Threads NOW — it goes live. Continue?'))return;
  const orig=btn.textContent; btn.disabled=true; btn.textContent='Sending…';
  try{
    const res=await fetch('/api/threads/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hook:lastThread.hook,posts:lastThread.posts||[],cta:lastThread.cta||'',topic_tag:lastThread.topic_tag||'',mode})});
    const data=await res.json(); if(!res.ok||!data.ok)throw new Error(data.error||'Send failed');
    btn.textContent=mode==='now'?'Posted ✓':'Queued ✓'; showToast(mode==='now'?'Posted to Threads ✓':'Queued in Buffer ✓');
  }catch(e){ btn.textContent=orig; btn.disabled=false; showToast('Buffer: '+e.message); }
}
function copyTag(btn){ if(!lastThread)return; doC('#'+String(lastThread.topic_tag||'').replace(/^#/,'')); flashBtn(btn); showToast('Topic tag copied'); }
function copyWholeThread(btn){ if(!lastThread)return; const l=[]; if(lastThread.hook)l.push(lastThread.hook); (lastThread.posts||[]).forEach(p=>l.push(p)); if(lastThread.cta)l.push(lastThread.cta); doC(l.join('\n\n———\n\n')); flashBtn(btn); showToast('Whole thread copied'); }

async function loadThreadLog(){
  const el=document.getElementById('autoThreadsList'); el.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try{
    const res=await fetch('/api/threadlog'); const items=await res.json(); loaded.auto=true;
    if(!Array.isArray(items)||!items.length){ el.innerHTML='<div class="empty"><div class="tx">No auto-threads in the last 24 hours</div></div>'; return; }
    el.innerHTML=items.map(it=>'<div class="at"><div class="at-h"><span class="tag">'+esc(pillarShort(it.pillar))+'</span><span class="at-time">'+esc(fmtThreadTs(it.ts))+'</span></div><div class="at-topic">'+esc(it.topic||'Thread')+'</div><div class="at-body">'+esc(it.thread_text||it.hook||'')+'</div><div class="at-meta">'+esc(String(it.total_posts||'?'))+' posts'+(it.root_post_id?' · posted ✓':' · not posted')+'</div></div>').join('');
  }catch{ el.innerHTML='<div class="empty"><div class="tx">Couldn\'t load auto-threads</div></div>'; }
}
function fmtThreadTs(s){ const m=/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(String(s||'')); return m?(m[3]+'/'+m[2]+' '+m[4]+':'+m[5]):(s||''); }

async function loadInsights(){
  const el=document.getElementById('insightsPanel'); el.innerHTML='<div class="loading"><div class="spinner"></div></div>';
  try{
    const res=await fetch('/api/insights'); const d=await res.json(); if(!res.ok)throw new Error(d.error||'failed'); loaded.insights=true;
    const agg=Object.fromEntries((d.aggregate||[]).map(m=>[m.type,m.value]));
    const chs=Object.entries(d.perChannel||{}).filter(([n])=>!/twitter|^x$/i.test(n));
    const totViews=chs.reduce((a,[,c])=>a+c.views,0), totC=chs.reduce((a,[,c])=>a+c.comments,0);
    let html='<div class="stats"><div class="stat"><div class="v">'+d.totalPosts+'</div><div class="k">posts</div></div><div class="stat"><div class="v">'+totViews.toLocaleString()+'</div><div class="k">views</div></div><div class="stat"><div class="v">'+totC+'</div><div class="k">comments</div></div></div>';
    if(chs.length){ html+='<table class="ins-t"><tr><th>Channel</th><th>Posts</th><th>Views</th><th>Avg</th><th>💬</th><th>❤️</th></tr>'; for(const [name,c] of chs) html+='<tr><td>'+esc(name)+'</td><td>'+c.posts+'</td><td>'+c.views+'</td><td>'+(c.posts?Math.round(c.views/c.posts):0)+'</td><td>'+c.comments+'</td><td>'+c.reactions+'</td></tr>'; html+='</table>'; }
    const list=(label,items)=>items&&items.length?'<div class="lbl" style="margin-top:14px">'+label+'</div>'+items.map(p=>'<div class="ins-post"><div class="meta">'+p.views+' views · '+esc(p.channel)+' · '+esc(String(p.sentAt).slice(5,10).split('-').reverse().join('/'))+'</div><div class="txt">'+esc(p.text)+'</div></div>').join(''):'';
    html+=list('Top posts',d.top)+list('Weakest posts',d.bottom);
    el.innerHTML=html;
  }catch{ el.innerHTML='<div class="empty"><div class="tx">Couldn\'t load insights</div></div>'; }
}

// ─────────────────────────────────────────────────────────────────────────────
// Photo composers — one factory, two instances (screenshots → note → angle →
// Generate → edit per platform → Save / Send to Buffer):
//   C.s  Sealed                         /api/sealed  brand fixed, angles
//   C.p  StrategyDynamics/MarketDynamics /api/photo   brand toggle, pillars
// Every DOM id is namespaced `<ns>-<field>`; inline handlers call C['<ns>'].
// ─────────────────────────────────────────────────────────────────────────────
const CAPTION_FIELDS=['ig_caption','tiktok_title','tiktok_caption','threads_text','threads_topic','link'];
const C={};
function Composer(cfg){
  const ns=cfg.ns;
  const self={ cfg, images:[], angle:cfg.angles[0].v, brand:cfg.brands[0], mode:'queue', rowIndex:null, on:{}, posts:[], loadedHist:false, useImages:true };
  C[ns]=self;
  const id=k=>ns+'-'+k, $=k=>document.getElementById(id(k)), call=m=>"C['"+ns+"']."+m;
  const cols=cfg.angles.length<=5?cfg.angles.length:3;
  const plat=(p,sv,name,inner)=>'<div class="plat" id="'+id('plat-'+p)+'"><div class="plat-head"><span class="plat-name"><span class="sv '+sv+'">'+(sv==='th'?'@':sv.toUpperCase())+'</span>'+name+'</span><span class="sp"></span><button class="btn sm" onclick="copyEl(\''+id(p==='instagram'?'ig_caption':p==='tiktok'?'tiktok_caption':'threads_text')+'\',this)">Copy</button><button class="sw on" id="'+id('sw-'+p)+'" onclick="'+call("toggleSw('"+p+"')")+'" aria-label="'+name+' on/off"></button></div>'+inner+'</div>';
  const ta=(f,max,rows)=>'<textarea class="in" id="'+id(f)+'" rows="'+rows+'" oninput="'+call("cc('"+f+"',"+max+")")+';autosize(this)"></textarea><div class="cc" id="'+id('cc-'+f)+'">0 / '+max+'</div>';

  document.getElementById(cfg.mount).innerHTML=
    '<div class="card hl"><div class="card-head"><span class="card-title">'+esc(cfg.title)+'</span><span class="card-sub" id="'+id('label')+'">Draft</span></div><div class="card-body">'
    +(cfg.brands.length>1?'<div class="lbl">Brand</div><div class="angles" style="grid-template-columns:repeat('+cfg.brands.length+',1fr)" id="'+id('brands')+'">'+cfg.brands.map(b=>'<button class="angle'+(b===self.brand?' active':'')+'" data-b="'+esc(b)+'" onclick="'+call("setBrand(this.dataset.b,this)")+'">'+esc(b)+'</button>').join('')+'</div><div class="tiny" id="'+id('brandnote')+'" style="margin:6px 0 12px"></div>':'')
    +'<div class="drop" id="'+id('drop')+'" onclick="document.getElementById(\''+id('file')+'\').click()"><strong>Add screenshots</strong><span>Tap to choose · up to 10 · first image leads the carousel</span></div>'
    +'<input type="file" id="'+id('file')+'" accept="image/*" multiple hidden onchange="'+call('addFiles(this.files)')+'; this.value=\'\'">'
    +'<div class="thumbs" id="'+id('thumbs')+'"></div>'
    +'<div class="plat-head" style="margin:4px 0 0"><span class="tiny" style="color:var(--text)">Use screenshots when writing captions</span><span class="sp"></span><button class="sw on" id="'+id('useimg')+'" onclick="'+call('toggleUseImages()')+'" aria-label="Use screenshots for captions on/off"></button></div><div class="tiny" id="'+id('useimgnote')+'" style="margin-top:4px">Claude reads the screenshots and writes about what is on screen.</div>'
    +'<div class="lbl">What\'s this post about?</div><textarea class="in" id="'+id('note')+'" rows="3" placeholder="'+esc(cfg.notePlaceholder)+'"></textarea>'
    +'<div class="lbl">'+esc(cfg.angleLabel)+'</div><div class="angles" style="grid-template-columns:repeat('+cols+',1fr)" id="'+id('angles')+'">'+cfg.angles.map(a=>'<button class="angle'+(a.v===self.angle?' active':'')+'" data-a="'+esc(a.v)+'" onclick="'+call("setAngle(this.dataset.a,this)")+'">'+esc(a.l)+'</button>').join('')+'</div>'
    +'<button class="btn primary block gen-btn" id="'+id('gen')+'" onclick="'+call('generate()')+'">Generate captions</button>'
    +'</div></div>'
    +'<div id="'+id('out')+'" style="display:none"><div class="what" id="'+id('what')+'" style="display:none"></div>'
    +plat('instagram','ig','Instagram',ta('ig_caption',2200,6))
    +plat('tiktok','tt','TikTok','<input class="in" id="'+id('tiktok_title')+'" placeholder="Title (bold, ≤ 90)" oninput="'+call("cc('tiktok_title',90)")+'"><div class="cc" id="'+id('cc-tiktok_title')+'">0 / 90</div>'+ta('tiktok_caption',2200,4))
    +plat('threads','th','Threads',ta('threads_text',500,4)+'<input class="in mono" id="'+id('threads_topic')+'" placeholder="topic tag (no #)" style="margin-top:6px"><div class="tiny" id="'+id('threadsnote')+'" style="margin-top:6px"></div>')
    +'<div class="plat"><div class="lbl">Link (Instagram Shop Grid)</div><input class="in mono" id="'+id('link')+'" placeholder="https://…"></div>'
    +'<div class="send-bar"><div class="mode"><button class="active" id="'+id('mode-queue')+'" onclick="'+call("setMode('queue')")+'">Add to queue</button><button id="'+id('mode-now')+'" onclick="'+call("setMode('now')")+'">Post now</button></div>'
    +'<div class="row"><button class="btn" onclick="'+call('save(true)')+'">Save draft</button><button class="btn primary" id="'+id('send')+'" style="flex:2" onclick="'+call('send()')+'">Send to Buffer</button></div><div class="res" id="'+id('res')+'"></div></div>'
    +'<button class="btn ghost block" style="margin-top:10px" onclick="'+call('reset()')+'">Start a new post</button></div>';

  const drop=$('drop');
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>self.addFiles(e.dataTransfer.files));

  self.visible=()=>{ const m=document.getElementById(cfg.mount); return !!(m&&m.offsetParent!==null); };
  self.defaultLink=()=>(channels&&channels.brands[self.brand]&&channels.brands[self.brand].link)||'';
  self.applyChannels=function(){
    let any=false;
    for(const p of ['instagram','tiktok','threads']){
      const ok=hasChannel(self.brand,p); any=any||ok; const sw=$('sw-'+p);
      if(!ok) self.on[p]=false; else if(self.on[p]===undefined) self.on[p]=true;
      if(sw){ sw.disabled=!ok; sw.classList.toggle('on',!!self.on[p]); }
      const pl=$('plat-'+p); if(pl)pl.classList.toggle('off',!self.on[p]);
    }
    const tn=$('threadsnote'); if(tn) tn.textContent=hasChannel(self.brand,'threads')?'The topic tag shows beside the account name — hashtags don\'t link on Threads.':self.brand+' Threads isn\'t connected in Buffer yet — the caption is still generated so you can copy it.';
    const bn=$('brandnote'); if(bn) bn.textContent=(channels&&!any)?self.brand+' has no Buffer channels connected yet — captions can still be generated, saved and copied.':'';
  };
  self.setBrand=function(b,btn){
    const old=self.defaultLink(); self.brand=b;
    document.querySelectorAll('#'+id('brands')+' .angle').forEach(x=>x.classList.toggle('active',x===btn||(!btn&&x.dataset.b===b)));
    for(const p of ['instagram','tiktok','threads']) self.on[p]=hasChannel(b,p)?true:false;
    const l=$('link'); if(l&&(!l.value||l.value===old)) l.value=self.defaultLink();
    self.applyChannels();
  };
  self.toggleUseImages=function(){ self.useImages=!self.useImages; $('useimg').classList.toggle('on',self.useImages); $('useimgnote').textContent=self.useImages?'Claude reads the screenshots and writes about what is on screen.':'Captions come from the brief and your note only. The screenshots still attach to the post.'; };
  self.toggleSw=function(p){ if(!hasChannel(self.brand,p))return; self.on[p]=!self.on[p]; $('sw-'+p).classList.toggle('on',self.on[p]); $('plat-'+p).classList.toggle('off',!self.on[p]); };
  self.setAngle=function(a,btn){ self.angle=a; document.querySelectorAll('#'+id('angles')+' .angle').forEach(x=>x.classList.toggle('active',btn?x===btn:x.dataset.a===a)); };
  self.setMode=function(m){ self.mode=m; $('mode-queue').classList.toggle('active',m==='queue'); $('mode-now').classList.toggle('active',m==='now'); $('send').textContent=m==='now'?'Post now via Buffer':'Send to Buffer'; };
  self.cc=function(f,max){ const el=$(f), cc=$('cc-'+f); if(!el||!cc)return; cc.textContent=el.value.length+' / '+max; cc.classList.toggle('over',el.value.length>max); el.classList.toggle('over',el.value.length>max); };

  self.addFiles=async function(files){
    const list=[...files].filter(f=>f.type.startsWith('image/'));
    if(!list.length)return;
    if(self.images.length+list.length>10){ showToast('Max 10 images'); return; }
    for(const f of list){
      const slot={ url:'', local:URL.createObjectURL(f), uploading:true }; self.images.push(slot); self.renderThumbs();
      try{
        const data=await fileToJpeg(f);
        const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images:[{data}]})});
        const j=await r.json(); if(!r.ok)throw new Error(j.error||'Upload failed');
        slot.url=j.images[0].url; slot.uploading=false;
      }catch(e){ self.images=self.images.filter(x=>x!==slot); showToast('Upload failed: '+e.message); }
      self.renderThumbs();
    }
  };
  self.renderThumbs=function(){
    $('thumbs').innerHTML=self.images.map((im,i)=>'<div class="thumb'+(im.uploading?' uploading':'')+'"><img src="'+esc(im.local||im.url)+'" alt=""><span class="n">'+(i+1)+(im.uploading?' ↑':'')+'</span><button class="x" onclick="'+call('removeImg('+i+')')+'" aria-label="Remove">×</button></div>').join('');
    drop.querySelector('strong').textContent=self.images.length?'Add more':'Add screenshots';
  };
  self.removeImg=function(i){ self.images.splice(i,1); self.renderThumbs(); };

  self.generate=async function(){
    const note=$('note').value.trim();
    const images=self.useImages?self.images.filter(x=>x.url).map(x=>x.url):[];
    if(self.useImages&&self.images.some(x=>x.uploading)){ showToast('Still uploading…'); return; }
    if(!self.useImages&&!note){ showToast('Add a note first — screenshots are switched off for captions'); return; }
    if(!note&&!images.length){ showToast('Add a screenshot or a note first'); return; }
    const btn=$('gen'); btn.disabled=true; btn.classList.add('loading'); btn.textContent='Writing captions…';
    try{
      const r=await fetch(cfg.api+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:self.brand,note,angle:self.angle,pillar:self.angle,images})});
      const d=await r.json(); if(!r.ok)throw new Error(d.error||'Generation failed');
      self.fill(d);
      const w=$('what'); if(d.what_i_see){ w.textContent='Model sees: '+d.what_i_see; w.style.display=''; } else w.style.display='none';
      setTimeout(()=>$('out').scrollIntoView({behavior:'smooth',block:'start'}),50);
      showToast('Captions ready — edit, then send');
    }catch(e){ showToast(e.message); }
    finally{ btn.disabled=false; btn.classList.remove('loading'); btn.textContent='Regenerate captions'; }
  };
  self.fill=function(d){
    for(const f of CAPTION_FIELDS){ const el=$(f); if(el&&d[f]!==undefined)el.value=d[f]||''; }
    if(!$('link').value) $('link').value=self.defaultLink();
    self.cc('ig_caption',2200); self.cc('tiktok_title',90); self.cc('tiktok_caption',2200); self.cc('threads_text',500);
    $('out').style.display='';
    requestAnimationFrame(()=>['ig_caption','tiktok_caption','threads_text'].forEach(f=>autosize($(f))));
  };
  self.payload=function(){
    const o={ brand:self.brand, note:$('note').value.trim(), angle:self.angle, images:self.images.filter(x=>x.url).map(x=>x.url), hook:$('tiktok_title').value.trim() };
    for(const f of CAPTION_FIELDS) o[f]=$(f).value;
    return o;
  };
  self.save=async function(toast){
    const body=self.payload();
    try{
      if(self.rowIndex){ const r=await fetch(cfg.api+'/posts/'+self.rowIndex,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok)throw new Error('Save failed'); }
      else { const r=await fetch(cfg.api+'/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok||!j.rowIndex)throw new Error(j.error||'Save failed'); self.rowIndex=j.rowIndex; }
    }catch(e){ if(!toast)throw e; showToast(e.message); return; }
    $('label').textContent='Row '+self.rowIndex;
    self.loadedHist=false;
    if(toast)showToast('Draft saved ✓');
  };
  self.send=async function(){
    const chs=['instagram','tiktok','threads'].filter(p=>self.on[p]&&hasChannel(self.brand,p));
    if(!chs.length){ showToast('No channel switched on'); return; }
    if(!self.images.filter(x=>x.url).length){ showToast('Add at least one screenshot'); return; }
    if(self.mode==='now'&&!confirm('Post to '+self.brand+' '+chs.join(', ')+' NOW — this goes live. Continue?'))return;
    const btn=$('send'), out=$('res'); out.innerHTML='';
    const orig=btn.textContent; btn.disabled=true; btn.textContent='Sending…';
    try{
      await self.save(false);
      const r=await fetch(cfg.api+'/send/'+self.rowIndex,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channels:chs,mode:self.mode})});
      const d=await r.json(); if(!r.ok)throw new Error(d.error||'Send failed');
      out.innerHTML=Object.entries(d.results||{}).map(([k,v])=>v.ok?'<div class="ok">✓ '+esc(k)+' — '+(self.mode==='now'?'posted':'queued')+'</div>':'<div class="err">✕ '+esc(k)+' — '+esc(v.error||'failed')+'</div>').join('');
      const anyFail=Object.values(d.results||{}).some(v=>!v.ok);
      showToast(anyFail?'Sent — some channels failed':(self.mode==='now'?'Posted via Buffer ✓':'Queued in Buffer ✓'));
      self.loadedHist=false; if(cfg.hist&&self.visible()) self.loadHistory();
    }catch(e){ out.innerHTML='<div class="err">'+esc(e.message)+'</div>'; showToast('Send failed'); }
    finally{ btn.disabled=false; btn.textContent=orig; }
  };
  self.reset=function(){
    self.images=[]; self.rowIndex=null; self.renderThumbs();

    $('label').textContent='Draft'; $('gen').textContent='Generate captions';

  };

  // ── History (saved rows in this store's sheet tab) ──
  self.loadHistory=async function(){
    const el=document.getElementById(cfg.hist); if(!el)return;
    if(!self.loadedHist)el.innerHTML='<div class="loading"><div class="spinner"></div></div>';
    spin(true);
    try{
      const r=await fetch(cfg.api+'/posts'); self.posts=await r.json(); if(!Array.isArray(self.posts))throw 0; self.loadedHist=true;
      if(cfg.countEl) document.getElementById(cfg.countEl).textContent=self.posts.filter(p=>p.status!=='Sent').length||'';
      if(!self.posts.length){ el.innerHTML='<div class="empty"><div class="ic">○</div><div class="tx">No '+esc(cfg.noun)+' yet</div><div class="sb">Compose one — it lands here</div></div>'; return; }
      el.innerHTML=self.posts.map(p=>{
        const sent=['instagram','tiktok','threads'].filter(k=>p['sent_'+k]);
        return '<button class="hist" onclick="'+call('open('+p.rowIndex+')')+'">'+(p.images[0]?'<img src="'+esc(p.images[0])+'" alt="">':'<div style="width:42px;height:74px;border-radius:6px;background:var(--bg3);flex:none"></div>')+'<div class="t"><div class="h">'+esc(p.hook||p.tiktok_title||p.note||'Untitled')+'</div><div class="m"><span>'+esc(String(p.created_at).slice(0,10))+'</span>'+(cfg.brands.length>1?'<span>'+esc(p.brand||'')+'</span>':'')+'<span>'+esc(cfg.angleShort?cfg.angleShort(p.angle):(p.angle||''))+'</span>'+(sent.length?'<span class="s">✓ '+sent.join(' · ')+'</span>':'<span>'+esc(p.status||'Draft')+'</span>')+'</div></div><span class="chev">›</span></button>';
      }).join('');
    }catch{ el.innerHTML='<div class="empty"><div class="tx">Couldn\'t load history</div></div>'; }
    finally{ spin(false); }
  };
  self.open=function(row){
    const p=self.posts.find(x=>x.rowIndex===row); if(!p)return;
    self.rowIndex=row; self.images=p.images.map(u=>({url:u,uploading:false})); self.renderThumbs();
    $('note').value=p.note||'';
    if(cfg.brands.length>1) self.setBrand(cfg.brands.includes(p.brand)?p.brand:cfg.brands[0]);
    self.setAngle(cfg.angles.some(a=>a.v===p.angle)?p.angle:cfg.angles[0].v);
    self.fill(p); $('what').style.display='none';
    $('label').textContent='Row '+row+(p.status==='Sent'?' · sent':''); $('gen').textContent='Regenerate captions';
    $('res').innerHTML='';
    if(cfg.afterOpen) cfg.afterOpen(); else window.scrollTo({top:0,behavior:'smooth'});
  };
  return self;
}

// Downscale on the client (max 2048px long edge, JPEG q.9) so uploads are
// quick on mobile data and the server never has to re-encode.
function fileToJpeg(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=2048, s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',0.9)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
    img.src=url;
  });
}

document.addEventListener('paste',e=>{ const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')); if(!fs.length)return; const c=Object.values(C).find(x=>x.visible()); if(c)c.addFiles(fs); });
